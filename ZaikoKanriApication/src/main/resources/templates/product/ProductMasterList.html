<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>商品マスタ一覧</title>
    <link rel="stylesheet" th:href="@{/product/ProductMasterList.css}">
</head>

<body>

<div class="container">

    <h1>商品マスタ一覧</h1>

    <!-- ボタンエリア -->
    <div class="button-area">

        <form th:action="@{/product/newproduct}" method="get">
            <button type="submit">新規商品登録</button>
        </form>

        <form th:action="@{/product/ProductSearch}" method="get">
            <button type="submit">商品検索</button>
        </form>

        <form th:action="@{/menu/ProductMasterKanri}" method="get">
            <button type="submit">マスタ管理へ戻る</button>
        </form>

    </div>

    <!-- 並び替え -->
    <form th:action="@{/product/ProductMasterList}" method="get" class="search-form">

        <label>並び替え</label>
        <select name="sort">
            <option value="id" th:selected="${sort == 'id'}">ID</option>
            <option value="maker" th:selected="${sort == 'maker'}">メーカー名</option>
            <option value="name" th:selected="${sort == 'name'}">商品名</option>
            <option value="price" th:selected="${sort == 'price'}">売価</option>
        </select>

        <label>順序</label>
        <select name="order">
            <option value="asc" th:selected="${order == 'asc'}">昇順</option>
            <option value="desc" th:selected="${order == 'desc'}">降順</option>
        </select>

        <div class="form-button">
            <button type="submit">適用</button>
        </div>

    </form>

    <table class="product-table">

        <tr>
            <th>ID</th>
            <th>JAN</th>
            <th>メーカー</th>
            <th>商品名</th>
            <th>売価</th>
            <th>操作</th>
            <th>ステータス</th>
            <th>販売状況</th>
        </tr>

        <tr th:each="product : ${productList}">
            <td th:text="${product.id}"></td>
            <td th:text="${product.janCode}"></td>
            <td th:text="${product.makerName}"></td>
            <td th:text="${product.productName}"></td>
            <td th:text="${product.price}"></td>

            <td>
                <a th:href="@{/product/ProductEdit/{id}(id=${product.id})}">
                    編集
                </a>
                <br>
                <a th:href="@{/product/ProductDelete/{id}(id=${product.id})}">
                    削除
                </a>
            </td>

            <td th:text="${product.status}"></td>
            <td th:text="${product.salesStatus}"></td>
        </tr>

    </table>

</div>

</body>
</html>
