<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>入荷履歴一覧</title>

    <link rel="stylesheet" th:href="@{/stock/StockInList.css}">

</head>

<body>

    <div class="container">

        <h1>入荷履歴一覧</h1>

		<div class="back-area">
		    <a th:href="@{/stock/ArrivalControll}">
		        <button type="button">戻る</button>
		    </a>
		</div>
		
		<form th:action="@{/stock/StockInList}" method="get" class="search-form">

		    <label>並び替え</label>
			<select name="sort">
			    <option value="id" th:selected="${sort == 'id'}">ID</option>
			    <option value="date" th:selected="${sort == 'date'}">入荷日</option>
			</select>

		    <label>順序</label>
			<select name="order">
			    <option value="asc" th:selected="${order == 'asc'}">昇順</option>
			    <option value="desc" th:selected="${order == 'desc'}">降順</option>
			</select>

		    <div class="form-button">
		        <button type="submit">適用</button>
		    </div>

		</form>
		
		<div class="display-switch">

		    <a th:href="@{/stock/StockInList(sort=${sort}, order=${order})}">
		        <button type="button">登録中商品のみ</button>
		    </a>

		    <a th:href="@{/stock/StockInList(
		            sort=${sort},
		            order=${order},
		            showDeleted=true)}">
		        <button type="button">削除済み商品も表示</button>
		    </a>

		</div>
		
        <table>

            <thead>
                <tr>
                    <th>入荷ID</th>
                    <th>商品名</th>
                    <th>入荷数</th>
                    <th>入荷日</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="stockIn : ${stockInList}">
                    <td th:text="${stockIn.id}"></td>

					<td>
					    <span th:each="product : ${productList}"
					          th:if="${product.id == stockIn.productId}">

					        <span th:if="${product.deleted}"
					              class="deleted-text">
					            【削除済み】
					        </span>

					        <span th:text="${product.productName}"></span>

					    </span>
					</td>

                    <td th:text="${stockIn.quantity}"></td>
                    <td th:text="${stockIn.arrivalDate}"></td>
                </tr>

            </tbody>

        </table>

    </div>

</body>

</html>
