<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>廃棄履歴一覧</title>
    <link rel="stylesheet" th:href="@{/stock/DisposalList.css}">
</head>

<body>

    <div class="container">

        <h1>廃棄履歴一覧</h1>

        <div class="button-area">
            <a th:href="@{/stock/DisposalMenu}">
                <button type="button">
                   戻る
                </button>
            </a>
        </div>

        <!-- ★並び替えフォーム -->
        <form th:action="@{/stock/DisposalList}" method="get" class="search-form">

            <label>並び替え</label>
            <select name="sort">
                <option value="id" th:selected="${sort == 'id'}">ID</option>
                <option value="date" th:selected="${sort == 'date'}">廃棄日</option>
            </select>

            <label>順序</label>
            <select name="order">
                <option value="asc" th:selected="${order == 'asc'}">昇順</option>
                <option value="desc" th:selected="${order == 'desc'}">降順</option>
            </select>

            <div class="form-button">
                <button type="submit">適用</button>
            </div>

        </form>

		<div class="display-switch">

		    <a th:href="@{/stock/DisposalList(sort=${sort}, order=${order})}">
		        <button type="button">登録中商品のみ</button>
		    </a>

		    <a th:href="@{/stock/DisposalList(
		            sort=${sort},
		            order=${order},
		            showDeleted=true)}">
		        <button type="button">削除済み商品も表示</button>
		    </a>

		</div>

        <table>

            <thead>
                <tr>
                    <th>廃棄ID</th>
                    <th>商品名</th>
                    <th>廃棄数</th>
                    <th>廃棄日</th>
                    <th>廃棄理由</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="disposal : ${disposalList}">
                    <td th:text="${disposal.id}"></td>

					<td>
					    <span th:each="product : ${productList}"
					          th:if="${product.id == disposal.productId}">

					        <span th:if="${product.deleted}"
					              class="deleted-text">
					            【削除済み】
					        </span>

					        <span th:text="${product.productName}"></span>

					    </span>
					</td>

                    <td th:text="${disposal.quantity}"></td>
                    <td th:text="${disposal.disposalDate}"></td>
                    <td th:text="${disposal.reason}"></td>
                </tr>

            </tbody>

        </table>

    </div>

</body>

</html>
