<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>販売履歴一覧</title>

    <link rel="stylesheet" th:href="@{/sales/SalesList.css}">

</head>

<body>

    <div class="container">

        <h1>販売履歴一覧</h1>

		<div class="button-area">

			<a th:href="@{/sales/SalesManagement}">
				<button type="button">
				   戻る
				</button>
			</a>

		</div>

		<form th:action="@{/sales/SalesList}" method="get" class="search-form">

		    <label>並び替え</label>
			<select name="sort">
			    <option value="id" th:selected="${sort == 'id'}">ID</option>
			    <option value="date" th:selected="${sort == 'date'}">販売日</option>
			</select>

		    <label>順序</label>
			<select name="order">
			    <option value="asc" th:selected="${order == 'asc'}">昇順</option>
			    <option value="desc" th:selected="${order == 'desc'}">降順</option>
			</select>

		    <div class="form-button">
		        <button type="submit">適用</button>
		    </div>

		</form>

        <table>

            <thead>
                <tr>
                    <th>販売ID</th>
                    <th>商品名</th>
                    <th>販売数</th>
                    <th>販売日</th>
                </tr>
            </thead>
			
            <tbody>

				<tr th:each="sales : ${salesList}">
				    <td th:text="${sales.id}"></td>

				    <td>
				        <span th:each="product : ${productList}"
				              th:if="${product.id == sales.productId}"
				              th:text="${product.productName}">
				        </span>
				    </td>

				    <td th:text="${sales.salesQuantity}"></td>
				    <td th:text="${sales.salesDate}"></td>
				</tr>

            </tbody>

        </table>
		
		
    </div>

</body>

</html>
