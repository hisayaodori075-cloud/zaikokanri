<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>ログイン</title>
    <link rel="stylesheet" th:href="@{/auth/login.css}">
</head>

<body>

	<form th:action="@{/auth/login}" method="post">

	    <h1 class="form-title">ログイン</h1>

		<!-- エラーメッセージ -->
		<div th:if="${param.error}" class="error-message">
		    ユーザー名またはパスワードが違います
		</div>
		
		<div>
		    ユーザー名
		    <input type="text"
		           name="username"
		           required>
		</div>

		<div>
		    パスワード
		    <input type="password"
		           name="password"
		           required>
		</div>

	    <button type="submit">
	        ログイン
	    </button>
	
		<div class="register-link">
		    <a th:href="@{/auth/register}">
		        新規登録はこちら
		    </a>
		</div>

	</form>

</body>
</html>
